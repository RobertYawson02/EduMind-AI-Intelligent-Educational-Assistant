services:
  - type: web
    name: edumind-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AUTH_ENABLED
        value: "1"
      - key: APP_USERNAME
        value: supervisor
      - key: APP_PASSWORD_HASH
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edumind-db
          property: connectionString

databases:
  - name: edumind-db
    plan: free